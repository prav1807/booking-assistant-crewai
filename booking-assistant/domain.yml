responses:
  utter_greet:
    - text: "Hi! I'm Emi, your virtual flight assistant. I can help you with flight search, booking, and travel policy questions. How can I help?"

  utter_ask_policy_question:
    - text: "What would you like to know? I can answer questions about baggage rules, visa requirements, fare conditions, disability assistance, and more."

  utter_ask_trip_type:
    - text: "Is this a one-way trip, a return trip, or multi-city?"

  utter_ask_origin:
    - text: "Which city or airport are you flying from? [Departure city/airport]"

  utter_ask_destination:
    - text: "And where are you flying to? [Arrival city/airport]"

  utter_ask_departure_date:
    - text: "What date would you like to depart? [Departure date]"

  utter_ask_return_date:
    - text: "And what date would you like to return? [Return date]"

  utter_ask_passenger_count:
    - text: "How many passengers are travelling?"

  utter_ask_cabin_class:
    - text: "Which cabin would you like — economy, premium economy, business, or first?"

  utter_ask_origin_choice:
    - text: "{origin_options_text}\n\nWhich airport would you like to depart from?"

  utter_ask_destination_choice:
    - text: "{destination_options_text}\n\nWhich airport would you like to arrive at?"

  utter_unknown_origin:
    - text: "Sorry, I couldn't find that departure city or airport. Could you try again — a city name or airport code both work."

  utter_unknown_destination:
    - text: "Sorry, I couldn't find that arrival city or airport. Could you try again — a city name or airport code both work."

  utter_invalid_airport_choice:
    - text: "Sorry, I didn't recognise that as one of the listed airports. Please pick one from the list — the three-letter code is easiest."

  utter_place_lookup_failed:
    - text: "I'm having trouble looking up airports right now. Please try again in a moment."

  utter_search_summary_one_way:
    - text: "Here's what I have: one-way from {origin_display} to {destination_display}, departing {departure_date}, {passenger_count} passenger(s), {cabin_class}. (Flight search is not connected yet.)"

  utter_search_summary_return:
    - text: "Here's what I have: return from {origin_display} to {destination_display}, departing {departure_date}, returning {return_date}, {passenger_count} passenger(s), {cabin_class}. (Flight search is not connected yet.)"
  utter_invalid_departure_date:
    - text: "Sorry, I couldn't read that as a valid departure date. It needs to be a real date within the next year. Could you give it as a day, month and year — for example 30 August 2026?"

  utter_invalid_return_date:
    - text: "Sorry, that return date doesn't work — it needs to be a real date on or after your departure date. Could you try again?"

  utter_searching:
    - text: "Let me search for flights — this can take a few seconds."

  utter_search_failed:
    - text: "Sorry, I couldn't complete the flight search just now. Please try again in a moment."

  utter_no_offers:
    - text: "I couldn't find any flights matching that search. We can try different dates or nearby airports."

  utter_offers_found:
    - text: "I found {offer_count} options. Here are the best ones."

  utter_show_offers:
    - text: "Here are the best options I found:\n\n{offers_text}"

  utter_ask_offer_choice:
    - text: "Which one would you like? Reply with its number."

  utter_invalid_offer_choice:
    - text: "Sorry, I didn't catch which option you meant. Please reply with the number shown next to it."

  utter_offer_expired:
    - text: "That fare has just expired — airline prices are only held for a short time. Let me search again for you."

  utter_offer_selected:
    - text: "Good choice:\n\n{selected_offer_text}\n\nNext I'll need the passenger details."

  utter_passenger_intro:
    - text: "Now I need the passenger details. These must match the traveller's passport exactly, since the ticket can't be changed to a different name."

  utter_passenger_all_at_once:
    - text: "Now I need the passenger details. Please provide all of the following — they must match the traveller's passport exactly:\n\n• First name\n• Last name\n• Title (Mr/Ms/Mrs/Miss/Dr)\n• Gender (male/female)\n• Date of birth\n• Email address\n• Phone number (with country code, e.g. +2305551234)\n\nYou can provide them all in one message."

  utter_ask_given_name:
    - text: "What's the passenger's first name, as it appears on their passport?"

  utter_invalid_given_name:
    - text: "That doesn't look like a valid first name. Please use letters only, as shown on the passport."

  utter_ask_family_name:
    - text: "And the family name, as on the passport?"

  utter_invalid_family_name:
    - text: "That doesn't look like a valid family name. Please use letters only, as shown on the passport."

  utter_ask_born_on:
    - text: "What's their date of birth?"

  utter_invalid_born_on:
    - text: "I couldn't read that as a valid date of birth. This booking is for adult passengers only, so it needs to be a real past date for someone aged 18 or over."

  utter_ask_passenger_title:
    - text: "What title should I use — Mr, Ms, Mrs, Miss or Dr?"

  utter_invalid_passenger_title:
    - text: "Please choose one of: Mr, Ms, Mrs, Miss or Dr."

  utter_ask_passenger_gender:
    - text: "The airline's booking system requires this to be recorded as male or female. Which should I enter?"

  utter_invalid_passenger_gender:
    - text: "The airline system only accepts male or female here. Please enter one of those."

  utter_ask_passenger_email:
    - text: "What's the passenger's own email address? The airline sends disruption notices here, and it must be the traveller's own address."

  utter_invalid_passenger_email:
    - text: "That doesn't look like a valid email address. Please check and try again."

  utter_ask_passenger_phone:
    - text: "And a contact phone number, with the country code — for example +2305551234?"

  utter_invalid_passenger_phone:
    - text: "I need the number in international format, starting with + and the country code, for example +2305551234."

  utter_passenger_details_done:
    - text: "Thank you. I have the passenger details for {passenger_title} {given_name} {family_name}."

  utter_repricing:
    - text: "Let me check that this fare is still available at the price I showed you."

  utter_price_changed:
    - text: "{price_change_text}"

  utter_offer_gone:
    - text: "That fare is no longer available — airlines hold prices only briefly. You'll need to search again to see current options."

  utter_reprice_failed:
    - text: "I couldn't confirm the current price just now, so I won't proceed with the booking. Please try again shortly."

  utter_confirmation_summary:
    - text: "Please check these details carefully before I book:\n\n{confirmation_text}"

  utter_ask_booking_confirmed:
    - text: "Shall I go ahead and book this? Please reply yes or no."

  utter_booking_cancelled:
    - text: "No problem — I haven't booked anything. Let me know if you'd like to look at other options."

  utter_booking_ok:
    - text: "Your booking is confirmed. Your airline reference is {booking_reference}. Keep this — you'll need it to check in or manage the booking with the airline."

  utter_booking_failed:
    - text: "I wasn't able to complete the booking, and no payment has been taken. Please try again, or contact support with the details of this conversation."
  
  utter_single_passenger_only:
    - text: "I can currently book for one passenger at a time. Group and family bookings need details for every traveller, which I'm not yet able to collect. Would you like to search for a single passenger instead?"

  utter_validating:
    - text: "Let me validate your booking details..."

  utter_validation_failed:
    - text: "There's an issue with your booking details: {validation_reason}. Could you correct that?"

  utter_verification_failed:
    - text: "I found an issue with the booking details: {verification_reason}. Please check and try again."

  utter_ask_booking_lookup_reference:
    - text: "Please provide your booking reference (PNR code) — it's usually a 6-character code from your confirmation email."

  utter_ask_booking_lookup_email:
    - text: "And the email address used when booking? I need this to verify it's your booking."

  utter_booking_details:
    - text: "Here are your booking details:\n\n{booking_details_text}"

  utter_booking_not_found:
    - text: "I couldn't find a booking with that reference. Please double-check the code and try again."

  utter_booking_unauthorized:
    - text: "The email address doesn't match the one on this booking. For security, I can only show booking details to the email address used during booking."

  utter_booking_blocked:
    - text: "I'm unable to show these booking details right now due to a security check. Please contact support for assistance."

actions:
    - action_validate_departure_date
    - action_validate_return_date
    - action_resolve_origin
    - action_resolve_destination
    - action_select_origin_airport
    - action_select_destination_airport
    - action_search_flights
    - action_present_offers
    - action_select_offer
    - action_validate_given_name
    - action_validate_family_name
    - action_validate_dob
    - action_validate_title
    - action_validate_gender
    - action_validate_email
    - action_validate_phone
    - action_reprice_offer
    - action_create_booking
    - action_validate_booking
    - action_crew_search
    - action_answer_policy
    - action_verify_booking
    - action_guardrail_check
    - action_retrieve_booking
    - action_guardrail_booking_response