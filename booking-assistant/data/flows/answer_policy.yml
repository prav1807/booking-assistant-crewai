flows:
  answer_policy_question:
    description: >
      Answer questions about airline policies, baggage rules, dangerous goods,
      visa and entry requirements, fare rules, refunds, ticket changes, or
      disability assistance. Use this flow when the user asks an informational
      question about travel rules or regulations rather than requesting a
      booking action.
    steps:
      - collect: policy_question
        description: >
          The user's policy or eligibility question. Fill this from whatever
          the user just asked. Examples: "What is the carry-on baggage limit?",
          "Do I need a visa for Japan?", "Can I bring a lithium battery?",
          "What's the refund policy?"

      - action: action_answer_policy
        next: END
